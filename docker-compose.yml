services:
  postgres:
    image: postgres:18-alpine
    container_name: codereviewpilot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-codereviewpilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-codereviewpilot}
      POSTGRES_DB: ${POSTGRES_DB:-codereviewpilot}
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U codereviewpilot -d codereviewpilot']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: codereviewpilot-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL:-postgresql://codereviewpilot:codereviewpilot@postgres:5432/codereviewpilot?schema=public}
      JWT_SECRET: ${JWT_SECRET}
      APP_WEB_REDIRECT_URL: ${APP_WEB_REDIRECT_URL:-http://localhost:8081/auth/callback}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-https://ligerking007.github.io/CodeReviewPilotAI}
      GITHUB_ALLOWED_USERNAMES: ${GITHUB_ALLOWED_USERNAMES:-}
      RATE_LIMIT_TTL_MS: ${RATE_LIMIT_TTL_MS:-60000}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-120}
      AI_REVIEW_RATE_LIMIT_TTL_MS: ${AI_REVIEW_RATE_LIMIT_TTL_MS:-3600000}
      AI_REVIEW_RATE_LIMIT_MAX: ${AI_REVIEW_RATE_LIMIT_MAX:-5}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_CALLBACK_URL: ${GITHUB_CALLBACK_URL:-http://localhost:3000/auth/github/callback}
      GITHUB_TOKEN_ENCRYPTION_KEY: ${GITHUB_TOKEN_ENCRYPTION_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}
      GITHUB_APP_WEBHOOK_SECRET: ${GITHUB_APP_WEBHOOK_SECRET:-}

  mobile:
    build:
      context: .
      dockerfile: apps/mobile/Dockerfile
      args:
        EXPO_PUBLIC_API_URL: ${EXPO_PUBLIC_API_URL:-http://localhost:3000}
        EXPO_PUBLIC_APP_BASE_URL: ${EXPO_PUBLIC_APP_BASE_URL:-http://localhost:8081}
    container_name: codereviewpilot-mobile
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - '8081:80'

volumes:
  postgres-data:
