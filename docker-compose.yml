services:
  postgres:
    image: postgres:18-alpine
    container_name: codereviewpilot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: codereviewpilot
      POSTGRES_PASSWORD: codereviewpilot
      POSTGRES_DB: codereviewpilot
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U codereviewpilot -d codereviewpilot']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: codereviewpilot-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://codereviewpilot:codereviewpilot@postgres:5432/codereviewpilot?schema=public
      JWT_SECRET: replace-with-a-long-random-secret
      APP_WEB_REDIRECT_URL: http://localhost:8081/auth/callback
      GITHUB_ALLOWED_USERNAMES: ''
      RATE_LIMIT_TTL_MS: 60000
      RATE_LIMIT_MAX: 120
      AI_REVIEW_RATE_LIMIT_TTL_MS: 3600000
      AI_REVIEW_RATE_LIMIT_MAX: 5
      GITHUB_CLIENT_ID: ''
      GITHUB_CLIENT_SECRET: ''
      GITHUB_CALLBACK_URL: http://localhost:3000/auth/github/callback
      GITHUB_TOKEN_ENCRYPTION_KEY: replace-with-32-byte-base64-key
      OPENAI_API_KEY: ''
      OPENAI_MODEL: gpt-4.1-mini
      GITHUB_APP_ID: ''
      GITHUB_APP_PRIVATE_KEY: ''
      GITHUB_APP_WEBHOOK_SECRET: ''

volumes:
  postgres-data:
